# LLM layer (plan D2, §6.4). Frozen prompt hashes are written by `run_p4_llm.py freeze`.
model: openai/gpt-oss-20b
base_url: https://openrouter.ai/api/v1
api_key_env: OPENROUTER_API_KEY
provider: {order: [coreweave/fp4], allow_fallbacks: false, require_parameters: true}
reasoning: {effort: low}         # D2. medium tried 2026-11-23 (dev: 0.12 vs 0.14, 3x cost, 5.6% truncated) and 2026-11-24 on Devign test (v2 F1 0.659 vs 0.658, LLM-layer bal.acc 0.530 vs 0.526, 4.1x cost; v2/artifacts_medium)
temperature: 0
seed: 42
max_tokens: 16384              # output cap (only used tokens are billed); low effort answers are ~300-600 tokens
response_format: json_schema   # strict JSON schema (constrained decoding) for the main model
invalid_retries: 2             # 2026-11-27: invalid JSON / finish=length -> ask again with seed+1, +2 (new calls only; cache keys unchanged)
concurrency: 12
timeout_s: 180
max_retries: 6
spend_cap_usd: 95.0            # hard stop for the whole cache (OpenRouter cap is 100 USD)
prompt_hashes: {pass1: d144fce8337cdb65, pass2_neutral: 3524c214d50c8a93, pass2_refute: 3506d008bbfd671a, zeroshot: 0b234000d8b1465a}
price_snapshot: {date: 2026-11-22, input_per_m: 0.03, output_per_m: 0.13}

# Model for RQ5 (verifier swap). Price is read from the response usage when available.
rq5_model: openai/gpt-oss-120b
# Provider for 120b (2026-11-27 pilot + probes on the 97 Pass-1 prompts that failed):
#   unpinned routing -> google-vertex drops the final '}' (client now closes it) and coreweave fails outright.
#   coreweave/fp4 120b never returns reasoning tokens (0/197 calls; its 20b endpoint does, 22990/22990): the analysis
#   channel is not split off, so the model "thinks" inside the answer -> strict json_schema: whitespace loop until
#   max_tokens (31/97 still invalid after 2 retries); json_object: writes {"analysis": ...} (82/97 invalid).
#   crusoe/bf16: 97/97 valid at the first attempt (1455/1455 in the pilot), ~2.7 s per call.
rq5_provider: {order: [crusoe/bf16], allow_fallbacks: false, require_parameters: true}
rq5_max_tokens: 4096           # valid 120b answers use <= ~900 tokens; caps the cost of a runaway answer before a retry
rq5_response_format: json_schema   # json_object = no schema grammar, validated client-side (prompts spell out the JSON)

prompt:
  max_code_lines: 400           # longer functions are shown as windows around sinks / suspicious lines
  max_code_chars: 24000
  max_sinks_shown: 12
  max_slices_shown: 3
  max_slice_lines: 40
  max_suspicious_lines: 4

retrieval:
  top_k_pairs: 2                # 1-2 contrastive pairs (vulnerable + patched)
  cwe_bonus: 0.15
  sink_bonus: 0.10
  context_lines: 3              # lines of context around the diff region of a demo pair
  max_demo_lines: 30

subsets:
  api_subset_random: 2000       # + PrimeVul paired test (870) for A7/A8/RQ5 (§7.4)
  uncertainty_n: 200            # P4 step 7: 200 functions x 3 repeated calls
  uncertainty_repeats: 3
